<ion-app>
  <ion-menu contentId="main-content" menuId="main-menu">
    <ion-header class="ion-no-border">
      <ion-toolbar class="menu-toolbar">
        <div class="menu-brand">
          <div class="menu-logo">SD</div>
          <div>
            <h2>SmartDrive™</h2>
            @if (currentUser(); as user) {
              <p class="sd-muted">{{ user.email }}</p>
            } @else {
              <p class="sd-muted">Welcome, guest</p>
            }
          </div>
        </div>
      </ion-toolbar>
    </ion-header>

    <ion-content class="menu-content">
      <ion-list lines="none" class="menu-list">
        <ion-menu-toggle auto-hide="false">
          <ion-item routerLink="/tabs/home" routerLinkActive="selected" button detail="false">
            <ion-icon slot="start" name="home-outline"></ion-icon>
            <ion-label>Home</ion-label>
          </ion-item>
        </ion-menu-toggle>

        @if (currentUser()) {
          <ion-menu-toggle auto-hide="false">
            <ion-item routerLink="/tabs/bookings" routerLinkActive="selected" button detail="false">
              <ion-icon slot="start" name="calendar-outline"></ion-icon>
              <ion-label>My Bookings</ion-label>
            </ion-item>
          </ion-menu-toggle>

          <ion-menu-toggle auto-hide="false">
            <ion-item routerLink="/tabs/wallet" routerLinkActive="selected" button detail="false">
              <ion-icon slot="start" name="wallet-outline"></ion-icon>
              <ion-label>SR Wallet</ion-label>
            </ion-item>
          </ion-menu-toggle>

          <ion-menu-toggle auto-hide="false">
            <ion-item routerLink="/tabs/account" routerLinkActive="selected" button detail="false">
              <ion-icon slot="start" name="person-circle-outline"></ion-icon>
              <ion-label>Account</ion-label>
            </ion-item>
          </ion-menu-toggle>

          <ion-menu-toggle auto-hide="false">
            <ion-item routerLink="/settings" routerLinkActive="selected" button detail="false">
              <ion-icon slot="start" name="settings-outline"></ion-icon>
              <ion-label>Settings</ion-label>
            </ion-item>
          </ion-menu-toggle>
        }

        <div class="menu-divider"></div>

        <ion-menu-toggle auto-hide="false">
          <ion-item routerLink="/reviews" routerLinkActive="selected" button detail="false">
            <ion-icon slot="start" name="star-outline"></ion-icon>
            <ion-label>Reviews & Ratings</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle auto-hide="false">
          <ion-item routerLink="/faq" routerLinkActive="selected" button detail="false">
            <ion-icon slot="start" name="help-circle-outline"></ion-icon>
            <ion-label>Help & FAQs</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle auto-hide="false">
          <ion-item routerLink="/about" routerLinkActive="selected" button detail="false">
            <ion-icon slot="start" name="information-circle-outline"></ion-icon>
            <ion-label>About SmartDrive™</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>

      <div class="menu-footer">
        @if (currentUser()) {
          <ion-menu-toggle auto-hide="false">
            <ion-button expand="block" fill="outline" color="danger" (click)="logout()">
              <ion-icon slot="start" name="log-out-outline"></ion-icon>
              Log Out
            </ion-button>
          </ion-menu-toggle>
        } @else {
          <ion-menu-toggle auto-hide="false">
            <ion-button expand="block" class="sd-gradient-btn" routerLink="/login">Log In</ion-button>
          </ion-menu-toggle>
          <ion-menu-toggle auto-hide="false">
            <ion-button expand="block" fill="outline" routerLink="/signup">Sign Up</ion-button>
          </ion-menu-toggle>
        }
      </div>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
