<ion-content [fullscreen]="true" class="ion-padding">
  <div class="auth-wrap">
    <div class="auth-brand">
      <div class="auth-logo">SD</div>
      <h1 class="sd-section-title">Welcome back</h1>
      <p class="sd-muted">Sign in to continue renting with SmartDrive™</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      @if (errorMessage()) {
        <div class="auth-alert">{{ errorMessage() }}</div>
      }

      <ion-item class="auth-item" lines="none">
        <ion-icon slot="start" name="mail-outline"></ion-icon>
        <ion-input
          type="email"
          label="Email"
          labelPlacement="floating"
          formControlName="email"
          autocomplete="email"
          inputmode="email"
        ></ion-input>
      </ion-item>

      <ion-item class="auth-item" lines="none">
        <ion-icon slot="start" name="lock-closed-outline"></ion-icon>
        <ion-input
          [type]="showPassword() ? 'text' : 'password'"
          label="Password"
          labelPlacement="floating"
          formControlName="password"
          autocomplete="current-password"
        ></ion-input>
        <ion-icon
          slot="end"
          [name]="showPassword() ? 'eye-off-outline' : 'eye-outline'"
          (click)="togglePassword()"
          class="toggle-icon"
        ></ion-icon>
      </ion-item>

      <div class="auth-row">
        <ion-item lines="none" class="remember-item">
          <ion-checkbox formControlName="rememberMe" slot="start"></ion-checkbox>
          <ion-text class="sd-muted">Remember me</ion-text>
        </ion-item>
        <a routerLink="/forgot-password" class="auth-link">Forgot password?</a>
      </div>

      <ion-button expand="block" type="submit" class="sd-gradient-btn" [disabled]="submitting()">
        @if (submitting()) {
          <ion-spinner name="dots"></ion-spinner>
        } @else {
          Log In
        }
      </ion-button>
    </form>

    <p class="auth-footer sd-muted">
      Don't have an account?
      <a routerLink="/signup" class="auth-link">Sign up</a>
    </p>
  </div>
</ion-content>
