<ion-header class="ion-no-border">
  <ion-toolbar class="sd-toolbar">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Account</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  @if (currentUser(); as user) {
    <div class="profile-card">
      <div class="avatar">{{ user.fullName.charAt(0) }}</div>
      <div>
        <h2>{{ user.fullName }}</h2>
        <p class="sd-muted">{{ user.email }}</p>
        <span class="sd-badge">{{ user.memberType }} Member</span>
      </div>
    </div>
  }

  <ion-list class="menu-list" lines="full">
    <ion-item routerLink="/settings" button detail>
      <ion-icon slot="start" name="settings-outline"></ion-icon>
      <ion-label>Edit Profile & Settings</ion-label>
    </ion-item>
    <ion-item routerLink="/tabs/bookings" button detail>
      <ion-icon slot="start" name="calendar-outline"></ion-icon>
      <ion-label>My Bookings</ion-label>
    </ion-item>
    <ion-item routerLink="/tabs/wallet" button detail>
      <ion-icon slot="start" name="wallet-outline"></ion-icon>
      <ion-label>SR Wallet</ion-label>
    </ion-item>
    <ion-item routerLink="/reviews" button detail>
      <ion-icon slot="start" name="star-outline"></ion-icon>
      <ion-label>Reviews & Ratings</ion-label>
    </ion-item>
    <ion-item routerLink="/faq" button detail>
      <ion-icon slot="start" name="help-circle-outline"></ion-icon>
      <ion-label>FAQ</ion-label>
    </ion-item>
    <ion-item routerLink="/about" button detail>
      <ion-icon slot="start" name="information-circle-outline"></ion-icon>
      <ion-label>About SmartDrive™</ion-label>
    </ion-item>
    <ion-item button detail="false" (click)="logout()" class="logout-item">
      <ion-icon slot="start" name="log-out-outline"></ion-icon>
      <ion-label>Log Out</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
