name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: smartdrive-app/android/**/*.gradle*

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: smartdrive-app
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        working-directory: smartdrive-app/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: smartdrive-app/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Name APK for distribution
        run: cp smartdrive-app/android/app/build/outputs/apk/debug/app-debug.apk smartdrive-app/android/app/build/outputs/apk/debug/smartdrivetm.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartdrivetm-apk-${{ github.sha }}
          path: smartdrive-app/android/app/build/outputs/apk/debug/smartdrivetm.apk
          if-no-files-found: error
          retention-days: 30
