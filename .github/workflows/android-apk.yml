name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: smartdrive-app/android/**/*.gradle*

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: smartdrive-app
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        working-directory: smartdrive-app/android
        run: chmod +x gradlew

      - name: Build debug APK for pull requests
        if: github.event_name == 'pull_request'
        working-directory: smartdrive-app/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload pull request APK artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: smartdrivetm-apk-${{ github.sha }}
          path: smartdrive-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Verify release signing secrets
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Prepare Android signing key
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/smartdrive-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/smartdrive-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Set Android release version
        if: github.event_name != 'pull_request'
        id: android-version
        run: |
          version_code=$((20 + GITHUB_RUN_NUMBER))
          version_name="1.0.$((version_code - 1))"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        working-directory: smartdrive-app/android
        run: ./gradlew --no-daemon assembleRelease -PandroidVersionCode=${{ steps.android-version.outputs.code }}

      - name: Name release APK
        if: github.event_name != 'pull_request'
        run: cp smartdrive-app/android/app/build/outputs/apk/release/app-release.apk smartdrive-app/android/app/build/outputs/apk/release/SmartDriveTM.apk

      - name: Publish latest SmartDriveTM APK release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.android-version.outputs.code }}
          VERSION_NAME: ${{ steps.android-version.outputs.name }}
        run: |
          gh release create "smartdrivetm-build-${VERSION_CODE}" \
            "smartdrive-app/android/app/build/outputs/apk/release/SmartDriveTM.apk" \
            --title "SmartDriveTM ${VERSION_NAME} (build ${VERSION_CODE})" \
            --notes "Automatically built from commit ${GITHUB_SHA}." \
            --latest
